#######################################################################
# 외부 API 연동 설정 (저장소에 포함, 비밀값 없음)
# 키는 환경변수 또는 로컬 application.yml 에 둔다: ANTHROPIC_API_KEY, external.clients.vworld.api-key
# 로컬 application.yml 에 spring.config.import: optional:classpath:application-external.yml 한 줄이 필요하다
#######################################################################
external:
  clients:
    # 소셜 로그인 사용자 조회: 사용자가 기다리는 로그인 경로 -> 짧게 포기, 재시도 없음
    oauth:
      connect-timeout: 1s
      response-timeout: 3s
      pool-wait-timeout: 500ms
      max-per-route: 30      # 업체별 벌크헤드(30) 이상이어야 벌크헤드를 통과한 호출이 연결을 기다리지 않는다
      max-total: 90          # 호스트 3곳(Kakao, Naver, Google) x 30
    # VWorld 지오코딩: 조회형. 빠르게 포기하고 1회 재시도, 캐시 사용
    vworld:
      base-url: https://api.vworld.kr
      connect-timeout: 1s
      response-timeout: 3s
      pool-wait-timeout: 500ms
      max-per-route: 30
      max-total: 60
    # Claude: AI 진단(스트리밍)과 영수증 추출. 비용이 드는 호출이라 읽기 타임아웃은 재시도하지 않는다
    claude:
      base-url: https://api.anthropic.com
      api-key: ${ANTHROPIC_API_KEY:}
      model: claude-haiku-5-5            # 가장 빠른 모델(공식 문서 기준). 모델은 교체될 수 있어 설정값으로 둔다
      max-output-tokens: 2048            # 출력 비용 상한
      connect-timeout: 2s
      # 스트리밍에서는 "바이트 사이 무응답 시간"이 된다. 토큰이 계속 흐르는 동안은 끊기지 않고 멈추면 끊긴다
      response-timeout: 20s
      pool-wait-timeout: 100ms
      max-per-route: 30      # 진단 전용 스레드(10) + 영수증 벌크헤드(10) = 20 이상
      max-total: 60
  claude:
    api-version: 2026-10-21  # anthropic-version 헤더 (공식 문서 예시 값)
    thinking: disabled       # 빠른 응답을 위해 사고 끄기 (Haiku 5.5 허용 값. 모델을 바꾸면 허용 값을 확인)
  # AI 기능 제어
  ai:
    enabled: true            # 킬스위치: EXTERNAL_AI_ENABLED=false + 재시작으로 기능을 끈다 (런타임 토글 아님)
    max-images: 3
    max-image-bytes: 5242880 # 장당 5MB
    max-symptom-length: 1000
    max-concurrent-streams: 10  # AI 진단 전용 스레드 수 = 동시 진단 상한. 넘으면 대기 없이 503
    flow-deadline: 50s       # 진단 하나의 전체 시간 상한 (ALB idle timeout 60s 보다 짧게)
  # 지오코딩 캐시 (VWorld 약관의 캐시 허용 여부는 확인 필요)
  geo:
    cache-enabled: true
    cache-ttl: 30d
    not-found-ttl: 10m

resilience4j:
  circuitbreaker:
    configs:
      external-default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        # 상대 장애로 보는 오류만 집계한다. 4xx(우리 요청 문제), 벌크헤드 거절, AI 출력 품질 문제는 제외
        recordExceptions:
          - com.example.Petbulance_BE.global.external.exception.UpstreamUnavailableException
          - com.example.Petbulance_BE.global.external.exception.UpstreamTimeoutException
          - com.example.Petbulance_BE.global.external.exception.UpstreamRateLimitedException
          - com.example.Petbulance_BE.global.external.exception.UpstreamBadResponseException
        ignoreExceptions:
          - com.example.Petbulance_BE.global.external.exception.UpstreamRejectedException
          - com.example.Petbulance_BE.global.external.claude.AiOutputException
          - io.github.resilience4j.bulkhead.BulkheadFullException
    instances:
      oauth-kakao:
        baseConfig: external-default
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 20s
      oauth-naver:
        baseConfig: external-default
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 20s
      oauth-google:
        baseConfig: external-default
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 20s
      vworld:
        baseConfig: external-default
      # 진단 스트림과 영수증이 공유한다. 스트림은 길게 정상 진행되므로 느린 호출 기준은 두지 않는다
      claude:
        baseConfig: external-default
  bulkhead:
    # 동시 호출 상한(세마포어). 넘으면 기다리지 않고 바로 실패시켜 Tomcat 스레드가 외부 호출에 다 묶이지 않게 한다
    configs:
      external-default:
        maxWaitDuration: 0
    instances:
      oauth-kakao:
        baseConfig: external-default
        maxConcurrentCalls: 30
      oauth-naver:
        baseConfig: external-default
        maxConcurrentCalls: 30
      oauth-google:
        baseConfig: external-default
        maxConcurrentCalls: 30
      vworld:
        baseConfig: external-default
        maxConcurrentCalls: 20
      # 진단은 전용 스레드풀(external.ai.max-concurrent-streams)이 상한 역할을 한다
      claude-receipt:
        baseConfig: external-default
        maxConcurrentCalls: 10
  retry:
    # 재시도 계층은 여기 한 곳뿐이다 (HttpClient5 자동 재시도는 꺼 두었다)
    instances:
      vworld:      # 조회형: 싸고 멱등 -> 읽기 타임아웃도 재시도
        maxAttempts: 2
        waitDuration: 300ms
        enableRandomizedWait: true
        retryExceptions:
          - com.example.Petbulance_BE.global.external.exception.UpstreamUnavailableException
          - com.example.Petbulance_BE.global.external.exception.UpstreamTimeoutException
      claude:      # AI: 읽기 타임아웃은 재시도 안 함(비용, 대기 2배). 연결 실패/5xx/529 과부하/429 만. 스트림은 열기 전에만
        maxAttempts: 2
        waitDuration: 1s
        enableExponentialBackoff: true
        enableRandomizedWait: true
        retryExceptions:
          - com.example.Petbulance_BE.global.external.exception.UpstreamUnavailableException
          - com.example.Petbulance_BE.global.external.exception.UpstreamRateLimitedException

